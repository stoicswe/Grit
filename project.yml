name: Grit
options:
  bundleIdPrefix: com.stoicswe.grit
  deploymentTarget:
    iOS: "18.6"
  xcodeVersion: "16.3"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "P22P7U46RW"
    IPHONEOS_DEPLOYMENT_TARGET: "18.6"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Date-serial build number (YYYY.MMDD.HHMM): always ascending, no
    # state to track across machines. Stamp a fresh one before each local
    # archive with scripts/set-build-number.sh (it rewrites this line and
    # regenerates the project). Every target inherits it via
    # $(CURRENT_PROJECT_VERSION) in its Info.plist so the app, widget and
    # share extension keep matching CFBundleVersions.
    CURRENT_PROJECT_VERSION: "2026.0908.1540"
    MARKETING_VERSION: "1.0"
    # Tells the Swift compiler to extract localizable strings from SwiftUI Text()
    # literals and String(localized:) calls into Localizable.xcstrings automatically
    # on every build. New strings appear as "New" state in the catalog for translation.
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Grit:
    type: application
    platform: iOS
    deploymentTarget: "18.6"
    scheme: {}
    sources:
      - path: Grit
      - path: Shared
      - path: LICENSE
        type: file
        buildPhase: resources
    dependencies:
      - target: GritWidget
        embed: true
    info:
      path: Grit/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required for BGTaskScheduler — without these iOS rejects the
        # registrations ("not advertised in the application's Info.plist")
        # and background notification / MR refresh never runs.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.stoicswe.grit.background.refresh
          - com.stoicswe.grit.watch.poll
        # Apple Intelligence on Private Cloud Compute (iOS 27+). Leave NO until
        # Apple grants the managed entitlement com.apple.developer.private-cloud-compute
        # (https://developer.apple.com/contact/request/private-cloud-compute/) and it
        # has been added to Grit/Grit.entitlements — FoundationModels aborts the app
        # if the model is used without it. Then set YES to enable cloud routing.
        GritPrivateCloudComputeEnabled: false
    entitlements:
      path: Grit/Grit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stoicswe.grit.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stoicswe.grit.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Grit/Info.plist
        CODE_SIGN_ENTITLEMENTS: Grit/Grit.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

  GritWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.6"
    scheme: {}
    sources:
      - path: GritWidget
      - path: Shared
    info:
      path: GritWidget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Grit Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GritWidget/GritWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stoicswe.grit.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stoicswe.grit.app.GritWidget
        INFOPLIST_FILE: GritWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: GritWidget/GritWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"

  GritShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.6"
    scheme: {}
    sources:
      - path: GritShareExtension
    info:
      path: GritShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stoicswe.grit.app.GritShareExtension
        INFOPLIST_FILE: GritShareExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
